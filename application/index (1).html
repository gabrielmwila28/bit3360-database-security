<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Student Records – BIT3360</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
body{font-family:system-ui,sans-serif;max-width:980px;margin:0 auto;padding:16px;line-height:1.4}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
input,button{padding:8px;font-size:15px;margin:2px}
button{cursor:pointer}
.card{border:1px solid #8885;border-radius:8px;padding:12px;margin:12px 0}
.tabs button.on{font-weight:700;border-bottom:3px solid #2a6df4}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid #8884;padding:6px;text-align:left}
#msg{padding:10px;border-radius:6px;margin:10px 0;display:none}
.ok{background:#1a7f3722}.bad{background:#d1242f22}.info{background:#2a6df422}
.pill{background:#2a6df4;color:#fff;border-radius:99px;padding:2px 10px;font-size:13px}
td input{width:70px}
</style></head><body>
<h2>Secure Student Records Management</h2>

<form id="login" class="card">
  <b>Log in</b><br>
  <input id="email" type="email" list="accts" placeholder="Email" required autocomplete="username">
  <datalist id="accts">
    <option value="admin@bit3360.test"><option value="lecturer1@bit3360.test"><option value="lecturer2@bit3360.test">
    <option value="student.a@bit3360.test"><option value="student.b@bit3360.test"><option value="student.c@bit3360.test">
  </datalist>
  <input id="pw" type="password" placeholder="Password" required autocomplete="current-password">
  <button type="submit">Log in</button>
</form>

<div id="app" hidden>
  <header>
    <div>Signed in as <b id="who"></b> <span class="pill" id="role"></span></div>
    <button id="logout" type="button">Log out</button>
  </header>
  <div id="msg" role="status"></div>
  <div class="tabs">
    <button id="t-marks" type="button" class="on">Marks</button>
    <button id="t-audit" type="button">Audit logs</button>
  </div>
  <div class="card">
    <input id="search" type="search" placeholder="Search student, number or course" aria-label="Search">
    <div id="count"></div>
    <div class="wrap" id="out"></div>
  </div>
</div>
<script src="app.js"></script>
</body></html>
